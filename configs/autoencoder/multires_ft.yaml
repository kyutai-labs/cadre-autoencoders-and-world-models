# Multi-resolution finetune after the cooldown: run with --continue_from <cooldown run>/checkpoint-359999. Clips are
# loaded at the largest bucket and each step downscales the batch to the next one; the model keeps each size
# (adaptive resolution) and rescales its decoder's spatial RoPE box by a random factor in [1/1.15, 1.15].
# `steps` only bounds the run: max_wall_hours ends it, with a final checkpoint.
steps: 420000
batch_size: 96
schedule:
  lr: 2.0e-5
  warmup_steps: 0
  decay_steps: 0
betas: [0.9, 0.95]
weight_decay: 0.0
ema_decay: 0.9999
latent_stats_decay: 0.99
loss:
  lpips_weight: 1.0
  dino_weight: 1.0
  dwt_weight: 0.25
  psd_weight: 1.0
  lpips_frame_frac: 0.25
  dino_frame_frac: 0.25
  dwt_levels: 2
  dwt_lowpass_weight: 0.25
  psd_prob: 0.25
  grad_balance_max: 10000.0
dino_rope_augmentation: true  # DINOv3 in train mode during training: its RoPE box-rescale augmentation
multires:
  buckets: [[256, 448], [288, 512], [320, 544], [352, 608], [384, 640]]
  rope_spatial_rescale: 1.15
max_wall_hours: 12.0
seed: 30
checkpoint_every: 2000
keep_recent: 2
keep_every: 10000
log_every: 200
eval_every: 2500
num_workers: 3
compile: true
