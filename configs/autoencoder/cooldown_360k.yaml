# Continuation of a pretrained cell to 360k steps with a cooldown: run with --continue_from
# <pretraining run>/checkpoint-149999, which restores the weights, EMA, optimizer, latent statistics and step.
# The rate stays at 2e-4, then decays along a cosine to 2e-5 over the last 70k steps.
steps: 360000
batch_size: 96
schedule:
  lr: 2.0e-4
  warmup_steps: 2000
  decay_steps: 70000
  min_lr: 2.0e-5
betas: [0.9, 0.95]
weight_decay: 0.0
ema_decay: 0.9999
latent_stats_decay: 0.99
loss:
  lpips_weight: 1.0
  dino_weight: 1.0
  dwt_weight: 0.25
  psd_weight: 1.0
  lpips_frame_frac: 0.25
  dino_frame_frac: 0.25
  dwt_levels: 2
  dwt_lowpass_weight: 0.25
  psd_prob: 0.25
  grad_balance_max: 10000.0
dino_rope_augmentation: true  # DINOv3 in train mode during training: its RoPE box-rescale augmentation
multires: null
max_wall_hours: null
seed: 30
checkpoint_every: 25000
keep_recent: 2
keep_every: 100000
log_every: 200
eval_every: 5000
num_workers: 6
compile: true
