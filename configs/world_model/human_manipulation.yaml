# World model for human manipulation (EgoDex: the head camera), one recipe for every autoencoder.
environment: human_manipulation  # actions: 102 deltas of both hands' poses per frame (dataset.ENVIRONMENTS)
# Without statistics, the world model clamps them to +-2048 and symlog-squashes them.
action_mean: null
action_std: null
noise_shift: 1.0  # no shift of the flow-time schedule
frames: 80
psd_fraction: 0.25
# Optimization, the same in every environment. 100001 steps (0 .. 100000) end with checkpoint-100000.
steps: 100001
batch_size: 64
schedule:
  lr: 1.0e-4
  warmup_steps: 1000
  decay_steps: 0
betas: [0.9, 0.99]
weight_decay: 0.1
grad_clip: 1.0
ema_decay: 0.9999
max_wall_hours: null
seed: 28
checkpoint_every: 10000
keep_recent: 1
keep_every: null
log_every: 1000
eval_every: 2000
num_workers: 6
compile: true
