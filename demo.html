<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CADRE World Models Experimental Research Demo</title>
<link rel="icon" type="image/x-icon" href="https://kyutai.org/favicon.ico">
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap">
<style>
:root {
  --bg: #121212; --surface: #191919; --raised: #232323; --line: #343434;
  --text: #EFEFEF; --muted: #9d9d9d; --dim: #656565;
  --green: #39F2AE; --orange: #f5ab4a; --pink: #f051db;
  --smallcaps: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color-scheme: dark;
  font-family: 'Satoshi', 'Satoshi-Variable', system-ui, Avenir, Helvetica, Arial, sans-serif;
  font-weight: 500; line-height: 1.45; color: var(--text); background: var(--bg);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
/* The page fits the window and never scrolls: the video takes the room the rest leaves (fitStage). */
html, body { height: 100%; overflow: hidden; }
body { margin: 0; display: flex; flex-direction: column; background: var(--bg); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
.sc { font-family: var(--smallcaps); font-variant: small-caps; text-transform: lowercase; letter-spacing: .03em; }

/* nav */
nav { flex: none; height: 52px; display: flex; align-items: center; gap: 18px;
  padding: 0 28px; background: var(--bg); border-bottom: 1px solid var(--line); }
nav .logo { display: flex; line-height: 0; opacity: .9; }
nav .logo:hover { opacity: 1; }
nav .logo svg { height: 19px; width: auto; }
/* ENPC's mark (Wikipedia's Logo-ENPC-IP-RVB.png, traced; grey made white, its blue kept, triangle beside the text):
   "PONTS" as tall as Kyutai's x-height, the last line on Kyutai's baseline (4.3 px above its box, the y's tail). */
nav .logos { display: flex; align-items: flex-end; gap: 16px; }
nav .logo.enpc { padding-left: 16px; border-left: 1px solid var(--line); padding-bottom: 4.3px; }
nav .logo.enpc svg { height: 29.5px; }
nav .brand { font-weight: 700; font-size: 17px; letter-spacing: .01em; padding-left: 18px; border-left: 1px solid var(--line); }
nav .brand span { color: var(--muted); font-weight: 500; }
nav .spacer { flex: 1; }
.readout { background: none; border: 0; padding: 0; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; cursor: default; }
.readout.slow { color: var(--orange); }
.readout.lost { color: var(--pink); cursor: pointer; }
.live-status { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; min-width: 0; }
.concurrency { color: var(--green); font-size: 12px; font-variant-numeric: tabular-nums; }
.concurrency.unavailable { color: var(--muted); }
.research-links { flex: none; display: flex; justify-content: center; align-items: center; flex-wrap: wrap;
  gap: 2px 20px; padding: 2px 12px 8px; border-top: 1px solid var(--line); font-size: 13px; }
.research-links a { display: inline-flex; align-items: center; min-height: 36px; padding: 4px;
  color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.research-links a:hover, .research-links a:focus-visible { color: var(--green); }
@media (max-width: 1100px) { nav .brand span { display: none; } }
@media (max-width: 620px) {
  nav { height: auto; min-height: 52px; flex-wrap: wrap; gap: 8px 12px; padding: 8px 12px; }
  .live-status { flex-basis: 100%; align-items: flex-start; }
}

main { flex: 1; min-height: 0; width: 100%; max-width: 1760px; margin: 0 auto; padding: 14px 28px 18px;
  display: flex; flex-direction: column; }

/* environment tabs */
.tabs { flex: none; display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.tab { position: relative; z-index: 0; background: none; border: 0; padding: 7px 18px; cursor: pointer;
  color: var(--muted); font-size: 16px; }
.tab::after { content: ''; position: absolute; inset: 0; z-index: -1; border: 1px solid var(--line);
  transform: skewX(-10deg); background: var(--surface); transition: border-color .2s, background .2s; }
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: #000; }
.tab[aria-selected="true"]::after { background: var(--green); border-color: var(--green); }
.tab .num { font-size: 11px; opacity: .55; margin-left: 6px; }

/* The video, its key strip (as wide) and the side panel (as tall as the video) are sized by fitStage, side by side. */
.layout { flex: 1; min-height: 0; display: flex; gap: 22px; justify-content: center; align-items: flex-start; }
.video { flex: none; }

/* video */
.stage { position: relative; background: #000; border: 1px solid var(--line); aspect-ratio: 16 / 9; outline: none;
  max-width: 100%; }
.stage.look { cursor: crosshair; }
.stage canvas { display: block; width: 100%; height: 100%; }
.stage canvas.ribbon { position: absolute; inset: 0; pointer-events: none; }
.pill { position: absolute; left: 12px; top: 10px; padding: 2px 10px; border-radius: 999px; font-size: 13px;
  pointer-events: none; background: rgba(18,18,18,.78); border: 1px solid currentColor; }
/* The mode badge: a dark glass pill, legible on bright and dark frames alike. */
.badge { background: rgba(10,10,10,.72); backdrop-filter: blur(4px); letter-spacing: .08em; font-weight: 600; }
.badge.interactive { color: var(--green); }
.badge.replay { color: var(--orange); }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 15px;
  pointer-events: none; }
/* Before and after a turn: the line's place, or the way back into it, over a dimmed frame. */
.loading.line { background: rgba(10,10,10,.3); align-content: center; gap: 14px; text-align: center; padding: 0 24px;
  text-shadow: 0 1px 8px #000; }
/* Out of one's turn: the current driver's stream, small, blurred and dark, and the controls dimmed (and inert). */
.stage.blurred { overflow: hidden; }
.stage.blurred canvas#screen { filter: blur(10px) brightness(.5); transform: scale(1.08); }
body.queued .tabs, body.queued .panel, body.queued .keys { opacity: .35; transition: opacity .3s; }
.loading.line .big { color: var(--text); font-size: 22px; }
.loading.line .btn { pointer-events: auto; flex: none; }

/* key strip */
.keys { display: flex; flex-wrap: wrap; gap: 10px 22px; margin-top: 12px; padding: 12px 14px; background: var(--surface);
  border: 1px solid var(--line); min-height: 54px; align-items: center; }
.keygroup { display: inline-flex; align-items: center; gap: 5px; font-size: 14px; color: var(--muted); }
.keygroup .what { margin-left: 4px; }
kbd { display: inline-grid; place-items: center; min-width: 30px; height: 30px; padding: 0 7px;
  font: 700 14px/1 'Satoshi', system-ui, sans-serif; color: var(--text); background: var(--raised);
  border: 1px solid #4a4a4a; border-bottom-width: 3px; border-radius: 5px;
  transition: background .06s, color .06s, border-color .06s; }
kbd.wide { min-width: 52px; font-size: 12px; }
kbd.down { background: var(--green); color: #000; border-color: var(--green); }
.keys .general { margin-left: auto; gap: 14px; }
.keys .general .keygroup { gap: 4px; }

/* side panel */
/* As tall as the video: the cards share its height, each centering its content. */
.panel { flex: none; width: clamp(260px, 22vw, 400px); display: flex; flex-direction: column; gap: 12px; }
.panel .card { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: space-evenly; }
.card { background: var(--surface); border: 1px solid var(--line); padding: 13px 16px; }
.row { display: flex; gap: 8px; margin-top: 12px; }
.seg { display: flex; border: 1px solid var(--line); }
.seg button { flex: 1; background: none; border: 0; padding: 7px 10px; cursor: pointer; color: var(--muted); font-size: 15px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--raised); color: var(--green); }
.btn { position: relative; z-index: 0; flex: 1; background: none; border: 0; padding: 8px 12px; cursor: pointer; font-size: 15px; color: #000; }
.btn::after { content: ''; position: absolute; inset: 0; z-index: -1; transform: skewX(-10deg); background: var(--green);
  border: 1px solid var(--green); transition: background .2s; }
.btn:hover::after { background: #6ff7c5; }
.btn.ghost { color: var(--text); }
.btn.ghost::after { background: var(--surface); border: 1px dashed var(--text); }
.btn.ghost:hover::after { background: var(--raised); }
.slider { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; margin-top: 10px; font-size: 14px; }
.slider:first-of-type { margin-top: 0; }
.slider label { color: var(--muted); }
.slider output { font-variant-numeric: tabular-nums; }
.slider input { grid-column: 1 / -1; width: 100%; accent-color: var(--green); }

/* environment controls */
.arm { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.arm + .arm { margin-top: 8px; }
.arm .name { width: 30px; color: var(--muted); }
.chips { display: flex; gap: 3px; }
.chip { background: var(--raised); border: 1px solid var(--line); color: var(--muted); padding: 2px 4px; font-size: 13px; cursor: pointer; border-radius: 3px; }
.chip.base { cursor: default; border-style: dashed; }
.chip[aria-pressed="true"] { color: var(--text); border-color: var(--green); }
.chip.moving { background: var(--green); color: #000; border-color: var(--green); }
.vehicle { display: flex; align-items: baseline; justify-content: space-between; }
.speed { display: flex; align-items: baseline; gap: 8px; }
.speed .v { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
.speed .u { color: var(--muted); font-size: 14px; }
.toggle { background: none; border: 1px solid var(--line); padding: 3px 10px; font-size: 13px; color: var(--muted); cursor: pointer; }
.toggle[aria-pressed="true"] { color: var(--green); border-color: var(--green); }
.gauge { position: relative; height: 14px; margin-top: 10px; background: var(--raised); border: 1px solid var(--line); }
.gauge .envelope { position: absolute; top: 0; bottom: 0; background: rgba(57,242,174,.12); border-left: 1px solid var(--green); border-right: 1px solid var(--green); }
.gauge .center { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--muted); }
.gauge .needle { position: absolute; top: -4px; bottom: -4px; width: 3px; margin-left: -1px; background: var(--orange); }
</style>
</head>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const KEY_LABELS = { Shift: "shift", Space: "space", Tab: "tab" };
// Space toggles the mode: replay plays the prompt clip's recording from its start (then the next clips', one after the
// other), interactive takes over from the frame on screen. Tab moves to the next clip.


let socket = null, hello = null, envs = {}, current = null, info = null;
let held = new Set();  // the environment's keys, sent to the server
const lit = new Set();  // every key of the strip that is down
let drawing = false, pendingFrame = null, chunkEnv = null, chunkInfo = null, renderedInfo = null;
const shown = [];  // display times of the last frames, for the fps readout
let latency = null;
const ctx = $("screen").getContext("2d");
const rctx = $("ribbon").getContext("2d");
let ribbonOn = true, ribbon = [];
const look = { x: 0, y: 0, drag: false, dragging: false };  // mouse motion not yet sent

function label(code) {
  return KEY_LABELS[code] || code.replace(/^Key/, "").replace(/^Digit/, "");
}
function send(message) {
  if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(message));
}

// --- connection ---
// Whether it is someone else's turn (waiting in line, or one's own turn over): the controls do nothing then.
function setQueued(on) {
  document.body.classList.toggle("queued", on);
  $("stage").classList.toggle("blurred", on);
  for (const id of ["tabs", "panel", "keys"]) $(id).inert = on;
  if (on) {
    $("badge").hidden = true;
    ribbon = [];
    drawRibbon();
  }
}
function connect() {
  if (socket && socket.readyState !== WebSocket.CLOSED) return;
  applyConcurrency(null);
  setQueued(true);
  setReadout("connecting", "");
  showLoading("connecting");
  socket = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  socket.binaryType = "arraybuffer";
  socket.onmessage = (event) => {
    if (typeof event.data === "string") onText(JSON.parse(event.data));
    else onFrame(event.data);
  };
  socket.onclose = (event) => {
    pendingFrame = null;
    hello = null;
    envs = {};
    applySettings({});
    applyConcurrency(null);
    setQueued(true);
    releaseKeys();
    if (document.pointerLockElement) document.exitPointerLock();
    const why = { 4001: "your turn is over", 4002: "the line is full, try again later" }[event.code] || "disconnected";
    setReadout(`${why}: rejoin`, "lost");
    showLine(why, "", "join the line again");
  };
}
// The overlay of the line: a headline, a detail and, once disconnected, a button that reconnects.
function showLine(big, detail, button) {
  const loading = $("loading");
  loading.hidden = false;
  loading.className = "loading sc line";
  loading.innerHTML = `<div class="big"></div><div class="detail"></div>` +
    (button ? `<div><button class="btn sc" type="button"></button></div>` : "");
  loading.querySelector(".big").textContent = big;
  loading.querySelector(".detail").textContent = detail;
  if (button) {
    loading.querySelector("button").textContent = button;
    loading.querySelector("button").addEventListener("click", connect);
  }
}
function showLoading(text) {
  $("loading").hidden = false;
  $("loading").className = "loading sc";
  $("loading").textContent = text;
}
function minutes(seconds) {
  return seconds < 60 ? "under a minute" : `about ${Math.ceil(seconds / 60)} min`;
}
function setReadout(text, cls) {
  $("readout").className = "readout sc " + cls;
  $("readout").textContent = text;
}
$("readout").addEventListener("click", connect);

function applyConcurrency(snapshot) {
  const display = $("concurrency");
  const valid = snapshot && [snapshot.active, snapshot.max_active, snapshot.waiting].every(Number.isInteger) &&
    snapshot.max_active > 0 && snapshot.active >= 0 && snapshot.active <= snapshot.max_active && snapshot.waiting >= 0;
  const text = valid ? `shared gpu · ${snapshot.active} / ${snapshot.max_active} active · ${snapshot.waiting} queued`
    : "shared gpu · status unavailable";
  if (display.textContent !== text) display.textContent = text;
  display.classList.toggle("unavailable", !valid);
  const detail = valid && snapshot.by_env && typeof snapshot.by_env === "object"
    ? Object.entries(snapshot.by_env).filter(([, count]) => Number.isInteger(count) && count >= 0)
      .map(([name, count]) => `${envs[name]?.title || name.replaceAll("_", " ")}: ${count}`).join(" · ") : "";
  display.title = "Active users and queued visitors across all environments sharing this GPU" +
    (detail ? `\nActive by environment — ${detail}` : "");
}

function onText(message) {
  if (message.concurrency) applyConcurrency(message.concurrency);
  if (message.type === "line") {
    const ahead = message.place - 1;
    setReadout(`in line: ${message.place} of ${message.length}`, "slow");
    showLine(ahead ? `${ahead} ${ahead === 1 ? "person" : "people"} ahead of you` : "you are next",
      `waiting for a shared slot · your turn in ${minutes(message.wait)} at most`);
  } else if (message.type === "hello") {
    setQueued(false);
    showLoading("your turn: starting");
    hello = message;
    envs = Object.fromEntries(message.envs.map((e) => [e.name, e]));
    if (message.concurrency) applyConcurrency(message.concurrency);
    applySettings(message);
    buildTabs();
    selectEnv(message.env, false);
    setReadout("live", "");
  }
}

function onFrame(buffer) {
  const size = new DataView(buffer).getUint32(0, true);
  const header = JSON.parse(new TextDecoder().decode(new Uint8Array(buffer, 4, size)));
  if (header.concurrency) applyConcurrency(header.concurrency);
  if (header.preview) {  // the current driver's stream, for the line (drawn blurred)
    if (hello) return;
    const blob = new Blob([new Uint8Array(buffer, 4 + size)], { type: "image/jpeg" });
    createImageBitmap(blob).then((bitmap) => { if (!hello) ctx.drawImage(bitmap, 0, 0, 512, 288); bitmap.close(); })
      .catch(() => {});
    return;
  }
  if (header.i === 0) { chunkEnv = header.env; chunkInfo = header; }
  if (chunkEnv !== current) return;  // still in flight from the environment we left
  const blob = new Blob([new Uint8Array(buffer, 4 + size)], { type: "image/jpeg" });
  // Keep only the newest pending frame if a browser cannot decode at stream speed.
  pendingFrame = { blob, info: chunkInfo, env: chunkEnv, connection: socket };
  if (!drawing) void drawFrames();
}

async function drawFrames() {
  drawing = true;
  try {
    while (pendingFrame) {
      const frame = pendingFrame;
      pendingFrame = null;
      let bitmap;
      try {
        bitmap = await createImageBitmap(frame.blob);
        if (frame.connection !== socket || frame.env !== current || !hello) continue;
        ctx.drawImage(bitmap, 0, 0, 512, 288);
        const now = performance.now();
        shown.push(now);
        while (shown.length > 40 || now - shown[0] > 2000) shown.shift();
        if (frame.info && frame.info !== renderedInfo) {
          applyInfo(frame.info);
          renderedInfo = frame.info;
        }
        $("loading").hidden = true;
      } catch (_) {
        // The next frame can still decode after a corrupt image or a closed connection.
      } finally {
        if (bitmap) bitmap.close();
      }
    }
  } finally {
    drawing = false;
  }
}

// --- environment ---
function buildTabs() {
  const tabs = $("tabs");
  tabs.textContent = "";
  hello.envs.forEach((env, i) => {
    const tab = document.createElement("button");
    tab.className = "tab sc";
    tab.setAttribute("role", "tab");
    tab.dataset.env = env.name;
    tab.innerHTML = `${env.title}<span class="num">${i + 1}</span>`;
    tab.addEventListener("click", () => selectEnv(env.name, true));
    tabs.appendChild(tab);
  });
}

function selectEnv(name, notify) {
  if (!envs[name]) return;
  releaseKeys();
  current = name;
  const env = envs[name];
  applySettings({ context_noise: hello.context_noise_by_env?.[name] ?? env.context_noise });
  for (const tab of $("tabs").children) tab.setAttribute("aria-selected", String(tab.dataset.env === name));
  const modes = $("modes");
  modes.textContent = "";
  for (const mode of env.modes) {
    const b = document.createElement("button");
    b.className = "sc";
    b.dataset.mode = mode;
    b.textContent = mode;
    b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", () => setMode(mode));
    modes.appendChild(b);
  }
  $("stage").classList.toggle("look", env.look);
  if (!env.look && document.pointerLockElement) document.exitPointerLock();
  buildKeys(env);
  buildHud(env);
  ribbon = [];
  drawRibbon();
  if (notify) {
    info = null;
    $("badge").hidden = true;
    showLoading("switching");
    send({ type: "env", env: name });
  }
}

function keycaps(codes) {
  return codes.map((c) => `<kbd data-code="${c}"${label(c).length > 1 ? ' class="wide"' : ""}>${label(c)}</kbd>`).join("");
}
function keygroup(caps, what) {
  return `<span class="keygroup">${caps}<span class="what sc">${what}</span></span>`;
}
function globalKeys() {
  const digits = hello.envs.map((_, i) => `Digit${i + 1}`);
  return [[digits, "environment"], [["Tab"], "next clip"], [["Space"], "interactive / replay"]];
}
function buildKeys(env) {
  const groups = env.hints.map(([codes, what]) => keygroup(keycaps(codes), what));
  if (env.look) groups.push(keygroup(`<kbd class="wide">mouse</kbd>`, "look"));
  const general = globalKeys().map(([codes, what]) => keygroup(keycaps(codes), what));
  $("keys").innerHTML = groups.join("") + `<span class="keygroup general">${general.join("")}</span>`;
  markKeys();
  fitStage();
}
function markKeys() {
  for (const kbd of $("keys").querySelectorAll("kbd[data-code]")) kbd.classList.toggle("down", lit.has(kbd.dataset.code));
}

function buildHud(env) {
  const hud = $("hud");
  $("hudcard").hidden = !["robot_manipulation", "driving"].includes(env.name);
  if (env.name === "robot_manipulation") {
    hud.innerHTML = ["left", "right"].map((arm) => `<div class="arm"><span class="name sc">${arm}</span><div class="chips">` +
      `<span class="chip base" data-dim="0">J0</span>` +
      env.joints.map((j, i) => `<button class="chip" data-arm="${arm}" data-joint="${i + 1}" aria-pressed="false">${j}</button>`).join("") +
      `</div></div>`).join("");
    for (const chip of hud.querySelectorAll("button.chip")) {
      chip.addEventListener("click", () => send({ type: "joint", arm: chip.dataset.arm, joint: Number(chip.dataset.joint) }));
    }
  } else if (env.name === "driving") {
    hud.innerHTML = `<div class="vehicle"><div class="speed"><span class="v" id="kmh">0</span><span class="u">km/h</span></div>
      <button class="toggle sc" id="ribbontoggle" aria-pressed="${ribbonOn}">path viz ${ribbonOn ? "on" : "off"}</button></div>
      <div class="gauge" aria-label="curvature"><div class="envelope" id="envelope"></div><div class="center"></div><div class="needle" id="needle"></div></div>`;
    $("ribbontoggle").addEventListener("click", () => {
      ribbonOn = !ribbonOn;
      $("ribbontoggle").setAttribute("aria-pressed", String(ribbonOn));
      $("ribbontoggle").textContent = `path viz ${ribbonOn ? "on" : "off"}`;
      drawRibbon();
    });
  } else {
    hud.innerHTML = "";
  }
}

function applyInfo(message) {
  if (!message.env || message.env !== current) return;
  info = message;
  applySettings(message);
  const badge = $("badge");
  badge.hidden = false;
  badge.className = `pill badge sc ${message.mode}`;
  badge.textContent = message.mode;
  if (message.latency_ms) latency = message.latency_ms;
  const fps = shown.length > 1 ? 1000 * (shown.length - 1) / (shown[shown.length - 1] - shown[0]) : 0;
  const text = `${fps ? fps.toFixed(1) : "–"} fps` + (latency ? ` · ${latency.toFixed(0)} ms latency` : "");
  const turn = message.turn_left === null ? "" : ` · ${message.turn_left} s left (${message.waiting} waiting)`;
  setReadout(text + turn, fps && fps < hello.fps * 0.95 ? "slow" : "");
  for (const b of $("modes").children) b.setAttribute("aria-pressed", String(b.dataset.mode === message.mode));
  updateHud(message.hud || {});
}

function updateHud(hud) {
  if (current === "robot_manipulation" && hud.selected) {
    for (const chip of $("hud").querySelectorAll("button.chip")) {
      const arm = chip.dataset.arm, joint = Number(chip.dataset.joint);
      chip.setAttribute("aria-pressed", String(hud.selected[arm] === joint));
      chip.classList.toggle("moving", hud.active.includes((arm === "left" ? 0 : 7) + joint));
    }
    const bases = $("hud").querySelectorAll(".chip.base");
    bases[0].classList.toggle("moving", hud.active.includes(0));
    bases[1].classList.toggle("moving", hud.active.includes(7));
  } else if (current === "driving" && hud.speed !== undefined) {
    $("kmh").textContent = (hud.speed * 3.6).toFixed(0);
    const scale = (k) => 50 - 50 * k / hud.k_max;  // positive curvature steers left
    $("envelope").style.left = `${scale(hud.limit)}%`;
    $("envelope").style.right = `${scale(hud.limit)}%`;
    $("needle").style.left = `${scale(hud.curvature)}%`;
    ribbon = hud.ribbon || [];
    drawRibbon();
  }
}

// The commanded path of the car (DrivingControls.ribbon), a thin line that fades toward the horizon.
function drawRibbon() {
  rctx.clearRect(0, 0, 512, 288);
  if (!ribbonOn || current !== "driving" || ribbon.length < 2) return;
  rctx.lineCap = "round";
  for (let i = 1; i < ribbon.length; i++) {
    const f = i / (ribbon.length - 1);
    rctx.strokeStyle = `rgba(57, 242, 174, ${0.9 - 0.65 * f})`;
    rctx.lineWidth = 3.2 - 2.2 * f;
    rctx.beginPath();
    rctx.moveTo(ribbon[i - 1][0], ribbon[i - 1][1]);
    rctx.lineTo(ribbon[i][0], ribbon[i][1]);
    rctx.stroke();
  }
}

// The video keeps 16:9 in the room the side panel leaves, above a key strip exactly as wide (whose height depends on
// its width: a few passes settle it); the panel is as tall as the video.
function fitStage() {
  const layout = $("layout"), panel = $("panel"), keys = $("keys");
  const maxWidth = layout.clientWidth - panel.offsetWidth - parseFloat(getComputedStyle(layout).columnGap);
  const maxHeight = layout.clientHeight - parseFloat(getComputedStyle(keys).marginTop);
  let width = maxWidth;
  for (let pass = 0; pass < 4; pass++) {
    keys.style.width = `${width}px`;
    const fit = Math.max(0, Math.min(maxWidth, (maxHeight - keys.offsetHeight) * 16 / 9));
    if (Math.abs(fit - width) < 0.5) break;
    width = fit;
  }
  for (const el of [$("video"), $("stage"), keys]) el.style.width = `${width}px`;
  panel.style.height = `${$("stage").offsetHeight}px`;
}
new ResizeObserver(fitStage).observe($("layout"));

// --- settings ---
function applySettings(message) {
  const locked = !hello || Boolean(hello.settings_locked);
  $("settingscard").hidden = locked;
  for (const id of ["steps", "noise"]) $(id).disabled = locked;
  const maximum = message.max_denoise_steps ?? hello?.max_denoise_steps ?? hello?.denoise_steps;
  if (Number.isFinite(maximum)) $("steps").max = maximum;
  if (hello && message.context_noise_by_env) hello.context_noise_by_env = { ...message.context_noise_by_env };
  if (hello && Number.isFinite(message.context_noise)) {
    hello.context_noise_by_env = { ...hello.context_noise_by_env, [message.env || current || hello.env]: message.context_noise };
  }
  for (const [id, value] of [["steps", message.denoise_steps], ["noise", message.context_noise]]) {
    if (Number.isFinite(value) && !$(id).matches(":active")) $(id).value = value;
  }
  showSettings();
}
function showSettings() {
  $("stepsv").textContent = $("steps").value;
  $("noisev").textContent = Number($("noise").value).toFixed(2);
}
for (const id of ["steps", "noise"]) {
  $(id).addEventListener("input", () => {
    if (!hello || hello.settings_locked) return;
    showSettings();
    send({ type: "settings", denoise_steps: Number($("steps").value), context_noise: Number($("noise").value) });
  });
  $(id).addEventListener("pointerup", () => $("stage").focus({ preventScroll: true }));
}

// --- buttons ---
function nextClip() { showLoading("loading a clip"); send({ type: "next" }); }
function setMode(mode) {
  if (mode === "interactive") { send({ type: "mode", mode }); return; }
  showLoading("replaying the clip");
  send({ type: "replay" });
}
function toggleMode() { if (info) setMode(info.mode === "interactive" ? "replay" : "interactive"); }
$("nextclip").addEventListener("click", nextClip);
// A mouse click returns the keys to the video; users of Tab keep their focus.
document.addEventListener("click", (event) => {
  if (event.detail > 0 && event.target.closest("button")) $("stage").focus({ preventScroll: true });
});

// --- keys ---
function relevant(code) {
  const env = envs[current];
  return !!env && env.hints.some(([codes]) => codes.includes(code));
}
function normalize(code) {
  return code === "ShiftLeft" || code === "ShiftRight" ? "Shift" : code;
}
function sendKeys(pressed) {
  send({ type: "keys", held: [...held], pressed: pressed || null });
}
function releaseKeys() {
  lit.clear();
  markKeys();
  if (held.size) { held = new Set(); sendKeys(null); }
}
function keyTarget(event) {  // not the focused control's own keys: a slider's arrows, Page and Home / End, a button's Space
  const el = document.activeElement;
  if (el?.closest(".research-links")) return false;
  if (event.code === "Tab" && (event.shiftKey || el !== $("stage"))) return false;
  if (el && el.matches("input[type=range]") && /^(Arrow|Page|Home|End)/.test(event.code)) return false;
  if (el && el.matches("button") && event.code === "Space") return false;
  return !(el && el.matches("input[type=text], textarea"));
}
const SCROLL_KEYS = new Set(["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "PageUp", "PageDown", "Home", "End"]);
window.addEventListener("keydown", (event) => {
  if (!keyTarget(event)) return;
  const code = normalize(event.code);
  if (SCROLL_KEYS.has(code)) event.preventDefault();
  if (!hello || event.metaKey || event.altKey || event.ctrlKey) return;
  if (!lit.has(code)) { lit.add(code); markKeys(); }
  const digit = /^Digit([1-9])$/.exec(code);
  if ((digit && hello.envs[digit[1] - 1]) || code === "Tab" || code === "Space") {
    event.preventDefault();  // Tab too: it picks a clip, focus stays
    if (event.repeat) return;
    if (code === "Tab") nextClip();
    else if (code === "Space") toggleMode();
    else { selectEnv(hello.envs[digit[1] - 1].name, true); lit.add(code); markKeys(); }
    return;
  }
  if (!relevant(code)) return;
  event.preventDefault();
  if (!held.has(code)) { held.add(code); sendKeys(event.repeat ? null : code); }
});
window.addEventListener("keyup", (event) => {
  const code = normalize(event.code);
  if (lit.delete(code)) markKeys();
  if (held.delete(code)) sendKeys(null);
});
window.addEventListener("wheel", (event) => event.preventDefault(), { passive: false });
window.addEventListener("blur", releaseKeys);
document.addEventListener("visibilitychange", () => { if (document.hidden) releaseKeys(); });

// --- mouse look: pointer lock on the video (Esc releases it), else drag; the motion is sent 25 times a second ---
const stage = $("stage");
stage.addEventListener("click", () => {
  stage.focus({ preventScroll: true });
  if (envs[current] && envs[current].look && !look.drag && document.pointerLockElement !== stage) {
    const request = stage.requestPointerLock();
    if (request && request.catch) request.catch(() => { look.drag = true; });
  }
});
document.addEventListener("pointerlockerror", () => { look.drag = true; });
stage.addEventListener("mousedown", () => { look.dragging = look.drag; });
window.addEventListener("mouseup", () => { look.dragging = false; });
document.addEventListener("mousemove", (event) => {
  if (!envs[current] || !envs[current].look) return;
  if (document.pointerLockElement === stage || look.dragging) { look.x += event.movementX; look.y += event.movementY; }
});
setInterval(() => {
  if (!look.x && !look.y) return;
  send({ type: "look", dx: look.x, dy: look.y });
  look.x = look.y = 0;
}, 40);

connect();
stage.focus({ preventScroll: true });
</script>
</body>
</html>
